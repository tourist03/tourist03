<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Vineet Singh — systems, backend, and applied AI engineer</title>
  <desc id="desc">A dark signal-room inspired banner connecting native runtime, backend systems, and applied AI.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090D18"/>
      <stop offset="0.55" stop-color="#0E1424"/>
      <stop offset="1" stop-color="#11182B"/>
    </linearGradient>
    <linearGradient id="signal" x1="90" y1="0" x2="1110" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#45D6C5"/>
      <stop offset="0.52" stop-color="#8B7CFF"/>
      <stop offset="1" stop-color="#FFB454"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#8B7CFF" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#8B7CFF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#273149" stroke-width="1" opacity="0.28"/>
    </pattern>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="1" y="1" width="1198" height="398" rx="24" fill="url(#bg)" stroke="#28334B" stroke-width="2"/>
  <rect x="1" y="1" width="1198" height="398" rx="24" fill="url(#grid)"/>
  <circle cx="985" cy="88" r="190" fill="url(#glow)"/>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="72" y="70" fill="#45D6C5" font-size="14" font-weight="700" letter-spacing="3">TOURIST03 / ENGINEERING LOG</text>
    <text x="1128" y="70" fill="#77839B" font-size="13" text-anchor="end" letter-spacing="2">BUILD ACROSS LAYERS</text>

    <text x="68" y="157" fill="#F5F7FB" font-size="66" font-weight="760" letter-spacing="2">VINEET SINGH</text>
    <text x="72" y="202" fill="#ADB7CA" font-size="22" font-weight="500" letter-spacing="1.5">I FOLLOW BUGS ACROSS ABSTRACTION BOUNDARIES.</text>

    <path d="M92 292 C250 250 360 320 520 292 S800 250 1108 292" fill="none" stroke="#34415D" stroke-width="10" stroke-linecap="round" opacity="0.32"/>
    <path id="route" d="M92 292 C250 250 360 320 520 292 S800 250 1108 292" fill="none" stroke="url(#signal)" stroke-width="3" stroke-linecap="round"/>

    <g filter="url(#softGlow)">
      <circle cx="92" cy="292" r="8" fill="#45D6C5"/>
      <circle cx="520" cy="292" r="8" fill="#8B7CFF"/>
      <circle cx="1108" cy="292" r="8" fill="#FFB454"/>
    </g>

    <circle r="5" fill="#F5F7FB" filter="url(#softGlow)">
      <animateMotion dur="7s" repeatCount="indefinite" rotate="auto">
        <mpath href="#route"/>
      </animateMotion>
    </circle>

    <text x="92" y="340" fill="#45D6C5" font-size="14" font-weight="750" letter-spacing="1.8">01 / NATIVE RUNTIME</text>
    <text x="520" y="340" fill="#9A8DFF" font-size="14" font-weight="750" text-anchor="middle" letter-spacing="1.8">02 / BACKEND SYSTEMS</text>
    <text x="1108" y="340" fill="#FFB454" font-size="14" font-weight="750" text-anchor="end" letter-spacing="1.8">03 / APPLIED AI</text>
  </g>
</svg>
